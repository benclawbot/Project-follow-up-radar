<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Follow-Up Radar</title><style>
:root{font-family:system-ui,sans-serif;color:#302a31;background:#f7f3ef}*{box-sizing:border-box}body{margin:0}header{background:#292633;color:#fff;padding:20px 6%;display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px}main{max-width:1100px;margin:auto;padding:30px 5%}h1{font:42px Georgia,serif;margin:0}p{color:#766e73}button,input,select,textarea{font:inherit;border:1px solid #ddd3cf;border-radius:8px;padding:10px;background:#fff;color:#302a31}button{cursor:pointer}.primary{background:#302a31;color:white}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fffdfa;border:1px solid #ebe3dd;border-radius:14px;padding:20px}.item{width:100%;display:block;text-align:left;border:0;border-bottom:1px solid #eee3dd;border-radius:0;padding:16px 8px}.item.selected{background:#fff1e9;border-left:3px solid #ae4d40}.item small{display:block;color:#807779;margin-top:5px}.tag{color:#a94e40;font-size:12px}label{display:block;margin:12px 0;font-size:13px}label input,label textarea,label select{display:block;width:100%;margin-top:5px}textarea{min-height:110px}dialog{border:0;border-radius:14px;max-width:600px;width:90%;padding:24px}dialog::backdrop{background:#201b2b88}blockquote{border-left:2px solid #e5dcd6;margin:12px 0;padding-left:12px;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.muted{color:#807779;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:34px}}
.portfolio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0 24px}.project-card{text-align:left;background:#fffdfa;border:1px solid #e6ded8;border-radius:12px;padding:17px;min-width:0}.project-card.active{border-color:#a94e40;box-shadow:inset 3px 0 #a94e40}.project-card strong,.project-card small{display:block}.project-card small{margin-top:7px;color:#807779}.project-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.project-top h2{margin-bottom:2px}.check-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee3dd}.check-row input{width:18px;height:18px;accent-color:#a94e40}.check-row span{flex:1}.check-row.done span{text-decoration:line-through;color:#807779}.check-row button{padding:5px 9px}.check-add{display:flex;gap:8px;margin-top:14px}.check-add input{flex:1;min-width:0}.progress{height:7px;border-radius:4px;background:#eee7e4;overflow:hidden}.progress span{display:block;height:100%;background:#a94e40}.status-note{white-space:pre-wrap;overflow-wrap:anywhere}.status-pill{font-size:12px;color:#a94e40}.history{font-size:12px;color:#807779} @media(max-width:700px){.portfolio{grid-template-columns:1fr 1fr}.project-top{align-items:flex-start}}
</style><header><strong>radar</strong><span>PROJECT FOLLOW-UP</span></header><main><p>YOUR PROJECT WORKSPACE</p><h1>Today, in focus.</h1><p>Keep commitments, decisions and original notes together.</p><div class="toolbar"><select id="project" aria-label="Project"></select><button id="newProject">New project</button><input id="search" placeholder="Search this project" aria-label="Search"><button id="addNote" class="primary">Add notes</button><button id="addItem">Add item</button><button id="backup">Export backup</button><label>Import backup<input id="restore" type="file" accept="application/json" hidden></label></div><section><div class="project-top"><div><h2>Your projects</h2><p class="muted">Choose a project to see its status and checklist.</p></div></div><div id="portfolio" class="portfolio"></div></section><section id="projectOverview" class="panel" style="margin-bottom:20px"></section><div class="grid"><section class="panel"><h2>Tracked items</h2><div id="items"></div></section><section class="panel" id="details"></section></div><p class="muted">Saved in this browser. Export a backup to move your work to another device.</p></main><dialog id="modal"><h2 id="modalTitle"></h2><form id="form"></form><button id="close">Cancel</button></dialog><script>
const key='radar-rebuild-v1', $=s=>document.querySelector(s), id=()=>crypto.randomUUID();
let data;try{data=JSON.parse(localStorage.getItem(key));if(!Array.isArray(data?.projects)||!data.projects.length)throw Error()}catch{data={active:'sample',projects:[{id:'sample',name:'Atlas rollout (sample)',items:[{id:'one',title:'Confirm the supplier quote',owner:'Marco Rossi',due:'',status:'waiting',kind:'commitment',source:'I will send the revised supplier quote.'},{id:'two',title:'Confirm launch date',owner:'',due:'',status:'open',kind:'issue',source:'Two sources mention different launch dates.'}],notes:[]}]}}let selected='';
function save(){localStorage.setItem(key,JSON.stringify(data))}function current(){return data.projects.find(p=>p.id===data.active)||data.projects[0]}function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}function button(text,fn){const b=el('button',text);b.type='button';b.onclick=fn;return b}function renderCore(){const p=current();data.active=p.id;$('#project').replaceChildren(...data.projects.map(x=>{let o=el('option',x.name);o.value=x.id;o.selected=x.id===p.id;return o}));let list=p.items.filter(i=>JSON.stringify(i).toLowerCase().includes($('#search').value.toLowerCase()));if(!list.some(i=>i.id===selected))selected=list[0]?.id||'';let nodes=list.map(i=>{let b=button('',()=>{selected=i.id;render()});b.className='item '+(selected===i.id?'selected':'');b.append(el('span',i.status.toUpperCase()+' · '+i.kind),el('h3',i.title),el('small',(i.owner||'Owner unconfirmed')+' · '+(i.due||'Date unconfirmed')));return b});$('#items').replaceChildren(...nodes);if(!nodes.length)$('#items').append(el('p','No matching items. Add a note or item to get started.'));let item=p.items.find(i=>i.id===selected),d=$('#details');d.replaceChildren();if(!item){d.append(el('h2','Your next step'),el('p','Select an item to see its context and prepare a follow-up.'));return}d.append(el('span',item.status.toUpperCase()),el('h2',item.title),el('p','Owner: '+(item.owner||'Unconfirmed')+' · Due: '+(item.due||'Unconfirmed')),el('h3','Original source'));d.append(el('blockquote',item.source||'Manually added; no source linked.'));let actions=el('div','');actions.className='actions';actions.append(button('Edit',()=>itemForm(item)),button(item.status==='done'?'Reopen':'Mark complete',()=>{item.status=item.status==='done'?'open':'done';save();render()}),button('Draft follow-up',()=>draft(item,p)));d.append(actions)}
function field(form,name,label,value='',type='text'){let l=el('label',label),input=document.createElement(type==='textarea'?'textarea':type==='select'?'select':'input');input.name=name;if(type==='select'){for(let v of ['commitment','decision','issue']){let o=el('option',v);o.value=v;input.append(o)}}else input.type=type;input.value=value;l.append(input);form.append(l);return input}function open(title){$('#modalTitle').textContent=title;$('#form').replaceChildren();$('#modal').showModal();return $('#form')}function submit(form,text,fn){let b=el('button',text);b.className='primary';b.type='submit';form.append(b);form.onsubmit=e=>{e.preventDefault();fn(new FormData(form));$('#modal').close();save();render()}}function itemForm(item){let f=open(item?'Edit item':'Add item');field(f,'title','What needs to happen?',item?.title||'').required=true;field(f,'owner','Owner',item?.owner||'');field(f,'due','Due date',item?.due||'','date');field(f,'kind','Type',item?.kind||'commitment','select');field(f,'source','Original source',item?.source||'','textarea');submit(f,'Save',v=>{let x={id:item?.id||id(),title:String(v.get('title')).trim(),owner:String(v.get('owner')),due:String(v.get('due')),kind:String(v.get('kind')),source:String(v.get('source')),status:item?.status||'open'};if(item)Object.assign(item,x);else{current().items.unshift(x);selected=x.id}})}function draft(i,p){let f=open('Follow-up draft'),t=field(f,'draft','Editable message',i.draft||`Hi ${i.owner||'team'},\n\nI’m following up on “${i.title}” for ${p.name}.\n\n${i.source?'Original note: “'+i.source+'”\n\n':''}Could you confirm the current status and expected completion date?\n\nThanks`,'textarea');let copy=button('Copy draft',async()=>{try{await navigator.clipboard.writeText(t.value);copy.textContent='Copied'}catch{t.select()}});f.append(copy);submit(f,'Save draft',v=>i.draft=String(v.get('draft')))}
const projectStatuses=[['not-started','Not started'],['on-track','On track'],['at-risk','At risk'],['off-track','Off track'],['on-hold','On hold'],['completed','Completed']];
function statusLabel(value){return projectStatuses.find(x=>x[0]===value)?.[1]||'Not started'}
function ensureProject(p){if(!Array.isArray(p.checklist))p.checklist=[];if(!Array.isArray(p.updates))p.updates=[];if(!projectStatuses.some(x=>x[0]===p.projectStatus))p.projectStatus='not-started';if(typeof p.statusNote!=='string')p.statusNote=''}
function render(){data.projects.forEach(ensureProject);renderCore();const p=current();const portfolio=$('#portfolio');portfolio.replaceChildren();data.projects.forEach(project=>{const complete=project.checklist.filter(c=>c.done).length;let card=button('',()=>{data.active=project.id;selected='';save();render()});card.className='project-card '+(p.id===project.id?'active':'');card.append(el('strong',project.name),el('small',statusLabel(project.projectStatus)+' · '+complete+'/'+project.checklist.length+' complete'));portfolio.append(card)});const overview=$('#projectOverview');overview.replaceChildren();const top=el('div','');top.className='project-top';const heading=el('div','');heading.append(el('h2',p.name),el('span',statusLabel(p.projectStatus)));top.append(heading,button('Update project status',()=>projectForm(p)));overview.append(top);if(p.statusNote){let note=el('p',p.statusNote);note.className='status-note';overview.append(note)}const complete=p.checklist.filter(c=>c.done).length;overview.append(el('h3','Project checklist'),el('p',complete+' of '+p.checklist.length+' complete'));let bar=el('div','');bar.className='progress';bar.setAttribute('role','progressbar');bar.setAttribute('aria-label','Checklist completion');bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax','100');bar.setAttribute('aria-valuenow',String(p.checklist.length?Math.round(complete/p.checklist.length*100):0));let fill=el('span','');fill.style.width=(p.checklist.length?complete/p.checklist.length*100:0)+'%';bar.append(fill);overview.append(bar);if(!p.checklist.length)overview.append(el('p','Add the steps needed to move this project forward.'));p.checklist.forEach(entry=>{let row=el('div','');row.className='check-row '+(entry.done?'done':'');let check=document.createElement('input');check.type='checkbox';check.checked=entry.done;check.setAttribute('aria-label','Mark '+entry.title+' complete');check.onchange=()=>{entry.done=check.checked;save();render()};let name=el('span',entry.title);row.append(check,name,button('Edit',()=>checkForm(entry)),button('Remove',()=>{if(confirm('Remove this checklist item?')){p.checklist=p.checklist.filter(x=>x.id!==entry.id);save();render()}}));overview.append(row)});let add=el('div','');add.className='check-add';let input=document.createElement('input');input.placeholder='Add a checklist item';input.setAttribute('aria-label','New checklist item');let addButton=button('Add step',()=>{let title=input.value.trim();if(!title)return;p.checklist.push({id:id(),title,done:false});save();render()});input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addButton.click()}};add.append(input,addButton);overview.append(add);if(p.updates.length){let history=document.createElement('details');history.className='history';history.append(el('summary','Status history'));p.updates.slice(0,10).forEach(u=>history.append(el('p',u.at+' · '+statusLabel(u.status)+(u.note?' — '+u.note:''))));overview.append(history)}}
function projectForm(p){let f=open('Update project');field(f,'name','Project name',p.name).required=true;let label=el('label','Status'),select=document.createElement('select');select.name='projectStatus';projectStatuses.forEach(([value,text])=>{let option=el('option',text);option.value=value;select.append(option)});select.value=p.projectStatus;label.append(select);f.append(label);field(f,'statusNote','Status update',p.statusNote,'textarea');submit(f,'Save update',v=>{let name=String(v.get('name')).trim(),status=String(v.get('projectStatus')),note=String(v.get('statusNote')).trim();if(!name)return;p.name=name;if(p.projectStatus!==status||p.statusNote!==note)p.updates.unshift({status,note,at:new Date().toLocaleString()});p.updates=p.updates.slice(0,100);p.projectStatus=status;p.statusNote=note})}
function checkForm(entry){let f=open('Edit checklist item');field(f,'title','Checklist item',entry.title).required=true;submit(f,'Save',v=>{let title=String(v.get('title')).trim();if(title)entry.title=title})}
$('#project').onchange=e=>{data.active=e.target.value;selected='';save();render()};$('#search').oninput=render;$('#newProject').onclick=()=>{let f=open('Create project');field(f,'name','Project name').required=true;submit(f,'Create',v=>{let p={id:id(),name:String(v.get('name')).trim(),items:[],notes:[]};data.projects.push(p);data.active=p.id;selected=''})};$('#addItem').onclick=()=>itemForm();$('#addNote').onclick=()=>{let f=open('Add original notes');field(f,'title','Source title').required=true;field(f,'body','Original text','','textarea').required=true;submit(f,'Save note',v=>{let body=String(v.get('body')).trim();current().notes.unshift({id:id(),title:String(v.get('title')),body});let lines=body.split(/\n+/).filter(x=>/\b(will|must|confirm|send|doit|confirmer|envoyer)\b/i.test(x));for(let line of lines.slice(0,20))current().items.unshift({id:id(),title:line.slice(0,180),owner:'',due:'',kind:'commitment',status:'open',source:line});selected=current().items[0]?.id||''})};$('#backup').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='radar-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.projects)||!x.projects.length||x.projects.some(p=>!Array.isArray(p.items)||!Array.isArray(p.notes)))throw Error();if(confirm('Replace this browser’s current projects with this backup?')){data=x;selected='';save();render()}}catch{alert('This is not a valid Radar backup.')}e.target.value=''};$('#close').onclick=()=>$('#modal').close();render();
</script></html>
