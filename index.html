<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Follow-Up Radar</title><style>
:root{font-family:system-ui,sans-serif;color:#302a31;background:#f7f3ef}*{box-sizing:border-box}body{margin:0}header{background:#292633;color:#fff;padding:20px 6%;display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px}main{max-width:1100px;margin:auto;padding:30px 5%}h1{font:42px Georgia,serif;margin:0}p{color:#766e73}button,input,select,textarea{font:inherit;border:1px solid #ddd3cf;border-radius:8px;padding:10px;background:#fff;color:#302a31}button{cursor:pointer}.primary{background:#302a31;color:white}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fffdfa;border:1px solid #ebe3dd;border-radius:14px;padding:20px}.item{width:100%;display:block;text-align:left;border:0;border-bottom:1px solid #eee3dd;border-radius:0;padding:16px 8px}.item.selected{background:#fff1e9;border-left:3px solid #ae4d40}.item small{display:block;color:#807779;margin-top:5px}.tag{color:#a94e40;font-size:12px}label{display:block;margin:12px 0;font-size:13px}label input,label textarea,label select{display:block;width:100%;margin-top:5px}textarea{min-height:110px}dialog{border:0;border-radius:14px;max-width:600px;width:90%;padding:24px}dialog::backdrop{background:#201b2b88}blockquote{border-left:2px solid #e5dcd6;margin:12px 0;padding-left:12px;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.muted{color:#807779;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:34px}}
</style><header><strong>radar</strong><span>PROJECT FOLLOW-UP</span></header><main><p>YOUR PROJECT WORKSPACE</p><h1>Today, in focus.</h1><p>Keep commitments, decisions and original notes together.</p><div class="toolbar"><select id="project" aria-label="Project"></select><button id="newProject">New project</button><input id="search" placeholder="Search this project" aria-label="Search"><button id="addNote" class="primary">Add notes</button><button id="addItem">Add item</button><button id="backup">Export backup</button><label>Import backup<input id="restore" type="file" accept="application/json" hidden></label></div><div class="grid"><section class="panel"><h2>Tracked items</h2><div id="items"></div></section><section class="panel" id="details"></section></div><p class="muted">Saved in this browser. Export a backup to move your work to another device.</p></main><dialog id="modal"><h2 id="modalTitle"></h2><form id="form"></form><button id="close">Cancel</button></dialog><script>
const key='radar-rebuild-v1', $=s=>document.querySelector(s), id=()=>crypto.randomUUID();
let data;try{data=JSON.parse(localStorage.getItem(key));if(!Array.isArray(data?.projects)||!data.projects.length)throw Error()}catch{data={active:'sample',projects:[{id:'sample',name:'Atlas rollout (sample)',items:[{id:'one',title:'Confirm the supplier quote',owner:'Marco Rossi',due:'',status:'waiting',kind:'commitment',source:'I will send the revised supplier quote.'},{id:'two',title:'Confirm launch date',owner:'',due:'',status:'open',kind:'issue',source:'Two sources mention different launch dates.'}],notes:[]}]}}let selected='';
function save(){localStorage.setItem(key,JSON.stringify(data))}function current(){return data.projects.find(p=>p.id===data.active)||data.projects[0]}function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}function button(text,fn){const b=el('button',text);b.type='button';b.onclick=fn;return b}function render(){const p=current();data.active=p.id;$('#project').replaceChildren(...data.projects.map(x=>{let o=el('option',x.name);o.value=x.id;o.selected=x.id===p.id;return o}));let list=p.items.filter(i=>JSON.stringify(i).toLowerCase().includes($('#search').value.toLowerCase()));if(!list.some(i=>i.id===selected))selected=list[0]?.id||'';let nodes=list.map(i=>{let b=button('',()=>{selected=i.id;render()});b.className='item '+(selected===i.id?'selected':'');b.append(el('span',i.status.toUpperCase()+' · '+i.kind),el('h3',i.title),el('small',(i.owner||'Owner unconfirmed')+' · '+(i.due||'Date unconfirmed')));return b});$('#items').replaceChildren(...nodes);if(!nodes.length)$('#items').append(el('p','No matching items. Add a note or item to get started.'));let item=p.items.find(i=>i.id===selected),d=$('#details');d.replaceChildren();if(!item){d.append(el('h2','Your next step'),el('p','Select an item to see its context and prepare a follow-up.'));return}d.append(el('span',item.status.toUpperCase()),el('h2',item.title),el('p','Owner: '+(item.owner||'Unconfirmed')+' · Due: '+(item.due||'Unconfirmed')),el('h3','Original source'));d.append(el('blockquote',item.source||'Manually added; no source linked.'));let actions=el('div','');actions.className='actions';actions.append(button('Edit',()=>itemForm(item)),button(item.status==='done'?'Reopen':'Mark complete',()=>{item.status=item.status==='done'?'open':'done';save();render()}),button('Draft follow-up',()=>draft(item,p)));d.append(actions)}
function field(form,name,label,value='',type='text'){let l=el('label',label),input=document.createElement(type==='textarea'?'textarea':type==='select'?'select':'input');input.name=name;if(type==='select'){for(let v of ['commitment','decision','issue']){let o=el('option',v);o.value=v;input.append(o)}}else input.type=type;input.value=value;l.append(input);form.append(l);return input}function open(title){$('#modalTitle').textContent=title;$('#form').replaceChildren();$('#modal').showModal();return $('#form')}function submit(form,text,fn){let b=el('button',text);b.className='primary';b.type='submit';form.append(b);form.onsubmit=e=>{e.preventDefault();fn(new FormData(form));$('#modal').close();save();render()}}function itemForm(item){let f=open(item?'Edit item':'Add item');field(f,'title','What needs to happen?',item?.title||'').required=true;field(f,'owner','Owner',item?.owner||'');field(f,'due','Due date',item?.due||'','date');field(f,'kind','Type',item?.kind||'commitment','select');field(f,'source','Original source',item?.source||'','textarea');submit(f,'Save',v=>{let x={id:item?.id||id(),title:String(v.get('title')).trim(),owner:String(v.get('owner')),due:String(v.get('due')),kind:String(v.get('kind')),source:String(v.get('source')),status:item?.status||'open'};if(item)Object.assign(item,x);else{current().items.unshift(x);selected=x.id}})}function draft(i,p){let f=open('Follow-up draft'),t=field(f,'draft','Editable message',i.draft||`Hi ${i.owner||'team'},\n\nI’m following up on “${i.title}” for ${p.name}.\n\n${i.source?'Original note: “'+i.source+'”\n\n':''}Could you confirm the current status and expected completion date?\n\nThanks`,'textarea');let copy=button('Copy draft',async()=>{try{await navigator.clipboard.writeText(t.value);copy.textContent='Copied'}catch{t.select()}});f.append(copy);submit(f,'Save draft',v=>i.draft=String(v.get('draft')))}
$('#project').onchange=e=>{data.active=e.target.value;selected='';save();render()};$('#search').oninput=render;$('#newProject').onclick=()=>{let f=open('Create project');field(f,'name','Project name').required=true;submit(f,'Create',v=>{let p={id:id(),name:String(v.get('name')).trim(),items:[],notes:[]};data.projects.push(p);data.active=p.id;selected=''})};$('#addItem').onclick=()=>itemForm();$('#addNote').onclick=()=>{let f=open('Add original notes');field(f,'title','Source title').required=true;field(f,'body','Original text','','textarea').required=true;submit(f,'Save note',v=>{let body=String(v.get('body')).trim();current().notes.unshift({id:id(),title:String(v.get('title')),body});let lines=body.split(/\n+/).filter(x=>/\b(will|must|confirm|send|doit|confirmer|envoyer)\b/i.test(x));for(let line of lines.slice(0,20))current().items.unshift({id:id(),title:line.slice(0,180),owner:'',due:'',kind:'commitment',status:'open',source:line});selected=current().items[0]?.id||''})};$('#backup').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='radar-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.projects)||!x.projects.length||x.projects.some(p=>!Array.isArray(p.items)||!Array.isArray(p.notes)))throw Error();if(confirm('Replace this browser’s current projects with this backup?')){data=x;selected='';save();render()}}catch{alert('This is not a valid Radar backup.')}e.target.value=''};$('#close').onclick=()=>$('#modal').close();render();
</script></html>
